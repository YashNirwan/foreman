[project]
name = "foreman"
version = "0.1.0"
description = "Agentic vision AI for warehouse safety review, built on NVIDIA NIM"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pillow>=10.0",
    "streamlit>=1.36",
    "mcp[cli]>=1.2",
]

[project.scripts]
foreman = "foreman.pipeline:main"
foreman-mcp = "foreman.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
